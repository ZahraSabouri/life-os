/* Local, attributed product photography complements the original illustrated UI. */
.photo-art{position:relative;overflow:hidden;background:#fff;display:block;isolation:isolate}
.photo-art>img{width:100%;height:100%;object-fit:contain;display:block;padding:8px 10px 21px}

.photo-credit a{color:#496b42;text-decoration:underline;text-underline-offset:2px}
.photo-tools{margin-top:22px;margin-bottom:12px}.photo-count{margin:0 0 15px;font-size:.75rem}
.art-gallery figure{border:1px solid #e1e5d4;background:#fffdf7;border-radius:9px;padding:10px;align-self:start}

.picture-picker .art-preview{height:220px;max-height:220px}.photo-credits-button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;padding:4px 8px;cursor:pointer}

.calendar-panel{margin-bottom:24px}

.cal-pace-figure{display:block;font-family:Georgia,serif;font-size:2.6rem;font-weight:400;letter-spacing:-.03em;color:#2e4f36;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px}
.cal-pace small,.cal-today small{display:block;font-size:.7rem;color:#828a74;line-height:1.6}
.cal-today{padding-left:26px;border-left:1px solid #ece9dc}
.cal-today strong{display:block;font-family:Georgia,serif;font-size:1.5rem;font-weight:400;margin:2px 0 4px;color:#3d604c}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{font-size:.62rem;letter-spacing:.12em;color:#8b9280;text-align:center;padding-bottom:4px;font-weight:650}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;min-height:74px;padding:8px 4px 6px;border:1px solid #e7e4d6;border-radius:9px;background:#fffdf7;color:#5e6a56;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,background .18s ease;animation:calRise .32s ease both}
.cal-day:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 14px #3a4a2a14;background:#f7f8ee}
.cal-day.out{visibility:hidden}
.cal-day.today{border-color:#7f9a6c;box-shadow:inset 0 0 0 1px #7f9a6c}
.cal-day.picked{background:#e3ebd6;border-color:#7f9a6c}
.cal-day.over .cal-bar{background:#c08a5e}
.cal-day.over .cal-amt{color:#96603c}
.cal-num{font-size:.78rem;font-weight:600;color:#43513c}
.cal-amt{font-size:.6rem;color:#6f8161;font-variant-numeric:tabular-nums}
.cal-bar{margin-top:auto;width:60%;max-width:34px;border-radius:3px 3px 0 0;background:#93ab7c;transition:height .5s cubic-bezier(.2,.8,.3,1)}
.cal-day-detail{margin-top:18px;padding-top:16px;border-top:1px dashed #d8dcc8;animation:calRise .28s ease both}
.cal-day-detail>strong{display:block;font-family:Georgia,serif;font-size:1.15rem;font-weight:400;margin-bottom:10px}
.cal-line{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #f0eee0;font-size:.84rem}

.cal-hint{margin-top:16px;font-size:.76rem;line-height:1.7}

.v2-main .surface,.v2-main .home-hero,.v2-main .collection-banner{animation:calRise .34s ease both}

 .cal-amt{font-size:.5rem}
}

/* Record shop & date */
.purchase-pick-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.purchase-pick{display:grid;gap:6px}
.purchase-pick-row{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--line,#dfe3d8);border-radius:10px;background:var(--surface,#fff)}
.purchase-pick-row input{margin-top:3px;flex:none}
.purchase-pick-row span{display:grid;gap:2px;min-width:0}
.purchase-pick-row small{color:var(--muted,#5f6b5d);overflow-wrap:anywhere}

/* Section tabs wrap their labels on narrow screens instead of overlapping. */
@media(max-width:640px){.page-tabs .segments{flex-wrap:nowrap}.page-tabs .segments button{flex:1 1 0;min-width:0;white-space:normal;line-height:1.25;font-size:.8125rem;padding:8px 6px;overflow-wrap:anywhere}}

/* Food & supplies: picture shelf, search and filter pills */
.cupboard-tools{display:grid;gap:14px;margin-bottom:26px;min-width:0}
.cupboard-tools .category-shelf{margin:0;padding-bottom:8px}
.category-shelf button{transition:border-color .15s,background .15s,transform .15s}
.category-shelf button:hover{border-color:#b9c3a0;transform:translateY(-1px)}
.category-shelf span{font-size:.7rem;font-weight:600;color:#667a5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category-shelf button.selected span{color:#35563a}
.cupboard-search-row{display:flex;gap:12px;align-items:center;min-width:0}
.cupboard-search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 18px;background:#fffdf7;border:1px solid #dcdacb;border-radius:999px;color:#7a8574;box-shadow:0 1px 2px #4b4a2e08;transition:border-color .15s,box-shadow .15s;cursor:text}
.cupboard-search:focus-within{border-color:#809b67;box-shadow:0 0 0 3px #809b6724}
.cupboard-search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:.95rem;color:var(--ink);padding:12px 0;outline:none!important}
.cupboard-search input::placeholder{color:#8d9689}
.cupboard-search-row .segments{flex:none;align-self:center}
.cupboard-filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.pill-select{position:relative;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 32px 0 15px;border:1px solid #dcdacb;border-radius:999px;background:#fffdf7;font-size:.84rem;line-height:1;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.pill-select:hover{border-color:#b9bfa6;background:#fffef9}
.pill-select-label{color:#7a8574}
.pill-select select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;font-weight:650;color:inherit;padding:0;margin:0;cursor:pointer;max-width:14rem;text-overflow:ellipsis;outline:none!important;min-height:0;field-sizing:content}
.pill-select:focus-within{outline:3px solid #a2782b;outline-offset:2px}
.pill-select>svg{position:absolute;right:12px;top:50%;transform:translateY(-50%) rotate(90deg);pointer-events:none;color:#7a8574}
.pill-select.active{background:#e3ebd6;border-color:#809b67;color:#2d4a33}
.pill-select.active .pill-select-label,.pill-select.active>svg{color:#56704b}
.pill-dates{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 8px 0 10px;border:1px solid #809b67;border-radius:999px;background:#e3ebd6;font-size:.84rem;color:#56704b}
.pill-dates input{border:0;background:none;font:inherit;font-weight:600;color:#2d4a33;padding:4px;min-height:0;width:auto;field-sizing:content}
.cupboard-count{display:flex;align-items:center;gap:12px;padding:0 4px;font-size:.84rem;color:#6b7768;white-space:nowrap}
.cupboard-count [role=status]{font-weight:650;color:#4a5a4b}
.cupboard-count .text-link{padding:0}
.cupboard-hint{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px 10px 16px;border:1px dashed #d3c69c;border-radius:14px;background:#fbf7ea;font-size:.875rem;color:#6d5a2f}
.purchase-meta{display:block;color:#6d5a2f;font-size:.75rem;line-height:1.45;margin-top:3px;overflow-wrap:anywhere}
@media(max-width:640px){
 .cupboard-tools{gap:12px}
 .cupboard-search{min-height:44px;padding:0 14px}
 .cupboard-search-row .segments button{min-height:38px;padding:7px 12px}
 .cupboard-filters{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .cupboard-filters::-webkit-scrollbar{display:none}
 .pill-select,.pill-dates{flex:none}
 .cupboard-search-row{flex-wrap:wrap}
 .cupboard-search{flex:1 1 100%}
 .cupboard-count{flex:1;padding:0 2px}
}

/* Shops */
.shops-view{display:grid;gap:18px}
.shops-head{display:flex;gap:12px;align-items:center}
.shops-head .cupboard-search{flex:1}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.shop-card{display:grid;grid-template-rows:132px auto;text-align:left;padding:0;overflow:hidden;background:#fffdf7;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 10px #55503008;transition:transform .15s,box-shadow .15s,border-color .15s}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px #4550320f;border-color:#c3ccb4}
.shop-card-art{height:132px;width:100%;object-fit:cover}
.shop-card-copy{display:grid;gap:4px;padding:14px 16px 16px}
.shop-card-copy strong{font-size:1.1rem}
.shop-kind{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#7d8a76}
.shop-facts{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:#5f6b5d}
.shop-facts b{font-weight:650;color:var(--ink)}
.shop-card-copy small{color:var(--muted);font-size:.78rem}
.shop-page{display:grid;gap:18px}
.shop-hero{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;align-items:start}
.shop-hero-copy{display:grid;gap:12px;min-width:0}
.shop-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.shop-notes{color:var(--muted);font-size:.9rem;margin:0}
.shop-products{display:grid;gap:8px}
.shop-product{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:8px 12px;background:#fffdf7;border:1px solid var(--line);border-radius:12px}
.shop-product:hover{border-color:#b9c3a0}
.shop-product-art{width:52px;height:52px;border-radius:9px;object-fit:cover}
.shop-product span{display:grid;gap:2px;min-width:0}
.shop-product small{color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.shop-product-price{justify-items:end;text-align:right}
.chip-list{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fffdf7;border-radius:999px;padding:7px 13px;font-size:.82rem}
.chip:hover{border-color:#b9c3a0}

/* Prices */
.prices-panel{display:grid;gap:14px;padding-top:6px;border-top:1px solid var(--line)}
.prices-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.prices-head .mini-head{margin:0}
.price-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.price-stat{display:grid;gap:2px;padding:10px 12px;background:#fffdf7;border:1px solid var(--line);border-radius:12px;min-width:0}
.price-stat span{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:#7d8a76}
.price-stat strong{font-size:1.25rem;line-height:1.2}
.price-stat small{color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}
.price-stat em{font-style:normal;font-size:.75rem;font-weight:650}
.price-stat em.up{color:#a44935}.price-stat em.down{color:#3d6b4f}
.price-chart{position:relative;padding:4px 0}
.price-chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.price-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:#5f6b5d;padding-bottom:4px}
.price-legend span{display:inline-flex;align-items:center;gap:6px}
.price-legend i{width:14px;height:3px;border-radius:2px;background:#888}
.price-legend i.offer-key{width:9px;height:9px;border-radius:1px;transform:rotate(45deg);background:#5f6b5d}
.price-grid{stroke:#e6e3d6;stroke-width:1}
.price-tick{fill:#7d8a76;font-size:11px}
.price-cross{stroke:#b9bfa6;stroke-width:1}
.price-tip{position:absolute;top:8px;transform:translateX(-50%);background:#233e32;color:#f4f2e7;border-radius:10px;padding:8px 11px;font-size:.78rem;pointer-events:none;box-shadow:0 6px 18px #23241a26;display:grid;gap:3px;z-index:2}
.price-tip small{opacity:.75}
.price-tip div{display:flex;align-items:center;gap:7px}
.price-tip i{width:12px;height:3px;border-radius:2px}
.price-tip b{font-size:.95rem}
.price-list{display:grid;gap:4px}
.price-row{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px}
.price-row:nth-child(odd){background:#fbf9f0}
.price-date{font-size:.78rem;color:#5f6b5d;font-variant-numeric:tabular-nums}
.price-where{display:grid;gap:1px;min-width:0}
.price-where small{color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}
.price-amount{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.price-amount b{font-variant-numeric:tabular-nums}

/* Picking products */
.product-suggest{display:grid;gap:4px;padding:6px;border:1px solid var(--line);border-radius:12px;background:#fffdf7;max-height:290px;overflow-y:auto}
.product-option{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:7px 9px;border:0;background:none;border-radius:9px}
.product-option:hover,.product-option.selected{background:#eef1e3}
.product-option-art{width:40px;height:40px;border-radius:8px;object-fit:cover}
.product-option span{display:grid;gap:1px;min-width:0}
.product-option small{color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}
.product-option-price{text-align:right;justify-items:end}
.product-option-icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;background:#e9eddc;color:#4f6a45}
.product-option.type strong{color:#3d6b4f}
.suggest-chip{align-self:start;border:1px dashed #b9c3a0;background:#f4f6ec;color:#4f6a45;border-radius:999px;padding:5px 11px;font-size:.78rem}
.product-structure{display:grid;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbf9f0}

/* Receipts */
.receipt-photo{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbf9f0}
.receipt-photo>div{display:grid;gap:8px}
.receipt-thumb{width:64px;height:64px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#efece0;color:#7d8a76;flex:none}
.receipt-thumb .art{width:64px;height:64px;object-fit:cover}
.receipt-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.receipt-photo-view{display:flex;gap:12px;align-items:center;color:var(--blue)}
.receipt-photo-view .art{width:96px;height:96px;object-fit:cover;border-radius:10px}
.offer-line{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.offer-line .field{min-width:160px;flex:1}

/* Recipe ingredients */
.ingredient-rows{display:grid;gap:12px}
.ingredient-row{display:grid;grid-template-columns:minmax(0,2fr) 92px 92px auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fffdf7}
.ingredient-main{display:grid;gap:8px;min-width:0}
.ingredient-status{grid-column:1/-1;font-size:.75rem;color:var(--muted)}
.ingredient-status.ok{color:#3d6b4f}
.ingredient-row .icon-button{align-self:center}

/* Things you keep */
.keep-panel{display:grid;gap:10px;justify-items:start}
.kept-list{display:grid;gap:6px;margin-top:8px}
.kept-row{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fffdf7}
.kept-row span{display:grid;gap:1px}
.kept-row small{color:var(--muted);font-size:.75rem}
.kept-row.gone{opacity:.72}
.danger-zone summary{color:#a44935}

/* Catalogue */
.catalogue-group{margin-bottom:22px}
.catalogue-group-head{display:flex;align-items:baseline;gap:10px;font-size:1rem;margin:0 0 10px;color:#3f513f}
.catalogue-group-head span{font-size:.78rem;color:var(--muted)}
.catalogue-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:.82rem;color:#5f6b5d;margin:2px 0 0}
.catalogue-price b{font-size:1rem;color:var(--ink)}
.catalogue-price small{color:var(--muted)}
.catalogue-note{margin:-6px 0 14px}
.pill-toggle{font-weight:650;padding:0 15px}
.pill-spacer{flex:1}
@media(max-width:860px){.shop-hero{grid-template-columns:1fr}.shop-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.price-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.ingredient-row{grid-template-columns:minmax(0,1fr) 80px 80px auto}}
@media(max-width:640px){.price-row{grid-template-columns:60px minmax(0,1fr);row-gap:4px}.price-amount{grid-column:2;justify-content:flex-start}.price-row .text-link{grid-column:2;justify-self:start}.shop-grid{grid-template-columns:1fr}.ingredient-row{grid-template-columns:minmax(0,1fr) 72px;row-gap:8px}.ingredient-row .icon-button{grid-column:2;justify-self:end}}

/* What things are: families, types and the products inside them */
.catalogue-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.type-trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.9rem;min-width:0}
.type-trail .crumb{border:0;background:none;color:#5f6b5d;padding:4px 2px;font:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#cdd3c2}
.type-trail .crumb:hover{color:var(--ink)}
.type-trail .crumb.here{color:var(--ink);font-weight:650;text-decoration:none}
.crumb-sep{color:#9aa694}
.seller-head{display:flex;align-items:center;gap:.5rem;margin:18px 0 8px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#7b7161}
.seller-head span{font-size:.72rem;letter-spacing:0;background:#f1ece1;border-radius:999px;padding:1px 8px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:24px}
.type-card{display:grid;grid-template-rows:104px auto;text-align:left;padding:0;overflow:hidden;background:#fffdf7;border:1px solid var(--line);border-radius:14px;transition:transform .15s,box-shadow .15s,border-color .15s}
.type-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px #4550320f;border-color:#c3ccb4}
.type-card-art{height:104px;width:100%;object-fit:cover}
.type-card>span{display:grid;gap:2px;padding:11px 13px 13px}
.type-card small{color:var(--muted);font-size:.75rem}
.type-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
.catalogue-home{margin:2px 0 0;font-size:.8rem;color:#3d6b4f}
/* Filing a product */
.type-picker{display:grid;gap:10px}
.type-picker-current{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.type-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#e9eddc;color:#33513c;font-size:.84rem;font-weight:600}
.type-browser{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fffdf7}
.type-options{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-height:260px;overflow-y:auto}
.type-option{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}

.type-result span{grid-row:1/3;grid-column:2;color:var(--muted);font-size:.8rem}

.type-add .field{flex:1;min-width:180px}

function spreadOf(state,expense){
  if(!expense.receiptId)return null;
  const r=(state.receipts||[]).find(x=>x.id===expense.receiptId);
  const n=r&&Number(r.spreadMonths);
  return n>1&&validDate(r.date)?{n:Math.min(60,Math.round(n)),from:dateMonth(r.date)}:null;
}
function budgetFigures(state,month){
  const b=state.budgets[month]||{grocery:null,total:0};
  const pence=n=>Math.round(Number(n)*100),spending=new Map();
  for(const expense of state.expenses){
    const sp=spreadOf(state,expense),total=pence(expense.amount);
    const parts=sp?spreadParts(total,sp.n,sp.from):[[dateMonth(expense.date),total]];
    for(const [key,amount] of parts){
      const row=spending.get(key)||{total:0,grocery:0};
      row.total+=amount;
      if(expense.type==='grocery')row.grocery+=amount;
      spending.set(key,row);
    }
  }
  // Recompute debt from the ledger, in pennies. Savings never increase a later
  // allowance; a missing budget contributes zero, so outstanding debt is retained.
  const months=[...new Set([...Object.keys(state.budgets),...spending.keys()])].filter(key=>/^\d{4}-(0[1-9]|1[0-2])$/.test(key)&&key<month).sort();
  let debt=0;
  for(const key of months)debt=Math.max(0,debt+(spending.get(key)?.total||0)-pence(state.budgets[key]?.total||0));
  const spent=spending.get(month)||{total:0,grocery:0},base=pence(b.total),adjusted=base-debt,remaining=adjusted-spent.total;
  const groceryCap=b.grocery==null?Math.max(0,adjusted):pence(b.grocery);
  const groceryRemaining=Math.min(groceryCap-spent.grocery,remaining);
  const otherRemaining=b.grocery==null?remaining:Math.min(Math.max(0,adjusted-groceryCap)-(spent.total-spent.grocery),remaining);
  return {b,baseTotal:base/100,carryIn:debt/100,adjustedTotal:adjusted/100,carryOut:Math.max(0,-remaining)/100,nextMonth:nextCalendarMonth(month),grocerySpent:spent.grocery/100,totalSpent:spent.total/100,totalRemaining:remaining/100,groceryLimit:groceryCap/100,groceryRemaining:groceryRemaining/100,otherRemaining:otherRemaining/100};
}

function validDate(date){
  if(typeof date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;
  const parsed=new Date(date+'T12:00:00');
  return Number.isFinite(parsed.getTime())&&isoDate(parsed)===date;
}
function withAmountAction(state,id,amount,action,date){
  const r=state.resources.find(x=>x.id===id),n=Number(amount);
  if(!r||r.used||!Number.isFinite(n)||n<.000001||n>Number(r.qty)||!['use','schedule'].includes(action)||!validDate(date))throw new Error('Check the amount and date before continuing.');
  if(!['g','ml','tin','bottle'].includes(r.unit)&&!Number.isInteger(n))throw new Error('Use a whole number for this item.');
  if(action==='schedule'&&(r.scheduledDate||!inPlanningMonth(r,dateMonth(date))))throw new Error('This portion cannot be planned for that date.');
  const patch=action==='use'?{used:true,usedDate:date}:{scheduledDate:date};
  if(n===Number(r.qty))return withResourcePatch(state,id,patch);
  const remainder=Number((Number(r.qty)-n).toFixed(6));
  if(remainder<=0)throw new Error('Choose a whole allocation or a smaller amount.');
  return {...state,resources:state.resources.flatMap(x=>x.id===id?[{...r,qty:remainder},{...r,id:uid('res'),parentId:r.parentId||r.id,qty:n,...patch}]:[x])};
}

function getWeeks(monthKey){
  const [y,m]=monthKey.split("-").map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  let start=new Date(first);
  const day=(start.getDay()+6)%7; // Mon=0
  start.setDate(start.getDate()-day);
  const weeks=[];
  let cur=new Date(start);
  while(cur<=last || cur.getMonth()===m-1){
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(cur); d.setDate(cur.getDate()+i);
      days.push({date:isoDate(d),inMonth:d.getMonth()===m-1,label:d.toLocaleDateString("en-GB",{weekday:"short"}),day:d.getDate()});
    }
    weeks.push(days);
    cur.setDate(cur.getDate()+7);
    if(weeks.length>6) break;
    if(cur>last && cur.getDay()===1) break;
  }
  return weeks;
}

/* Version 4 domain operations. Amounts in new records are integer pennies.
   Original allocations remain in resources, without migration changes. */
const clone = x => JSON.parse(JSON.stringify(x));
function need(ok,message){if(!ok)throw new Error(message);}
function pennies(value,blank=false){
  if(value===''||value==null){if(blank)return null;throw new Error('Enter an amount.');}
  need(/^\d+(\.\d{1,2})?$/.test(String(value)),'Use pounds and up to two decimal places.');
  const n=Math.round(Number(value)*100);need(Number.isSafeInteger(n)&&n<=100000000,'Amount is too large.');return n;
}
function positive(value){const n=Number(value);need(Number.isFinite(n)&&n>0&&n<=1e8,'Enter a quantity greater than zero.');return n;}
function category(s,id){return s.categories.find(c=>c.id===id)||s.categories.find(c=>c.id==='uncategorised');}
function validateV4(s){

  if(s.trackingStart){need(validDate(s.trackingStart),'Invalid plan start.');for(const field of ['expenses','receipts','adjustments'])for(const row of s[field]||[])need(row.date>=s.trackingStart,'This plan starts on '+s.trackingStart+'. Keep older products in the catalogue, not in spending.');}
  upgradeState({...s,version:3});
  for(const field of ['categories','items','lists','receipts','lots','stockEvents','mealEntries','recipes','subscriptions','goals','adjustments']){
    need(Array.isArray(s[field]),'Backup is missing '+field+'.');
    const ids=new Set();for(const x of s[field]){need(x&&typeof x.id==='string'&&!ids.has(x.id),'Duplicate or invalid '+field+' record.');ids.add(x.id);}
  }
  for(const c of s.categories)need(typeof c.name==='string'&&['grocery','other','unresolved'].includes(c.pool),'Invalid category.');
  need(s.categories.some(c=>c.id==='uncategorised'),'The pending category is required.');
  for(const x of s.items){need(typeof x.name==='string'&&s.categories.some(c=>c.id===x.categoryId),'Invalid catalogue item.');if(x.stockPerUnit!=null)need(Number.isFinite(x.stockPerUnit)&&x.stockPerUnit>0,'Pack size must be greater than zero.');}
  for(const x of s.expenses)need(validDate(x.date),'Invalid spending date.');
  for(const x of s.expenses)need((x.place==null||typeof x.place==='string')&&(x.details==null||typeof x.details==='string'),'Invalid purchase details.');
  for(const x of s.lots)need(typeof x.name==='string'&&typeof x.unit==='string'&&['count','measured','level','durable'].includes(x.tracking)&&Number.isFinite(x.remaining)&&x.remaining>=0&&Number.isFinite(x.quantity)&&x.quantity>0&&x.remaining<=x.quantity,'Invalid stock lot.');

// Monday–Sunday weeks use local calendar dates, including across months and DST.

// Receipts are the source of truth. Otherwise the stock record keeps its own purchase details;
// plan shares store them on the resource so split portions inherit them.
function stockPurchase(s,row){
 const raw=row.source==='resource'?{...(s.resources.find(r=>r.id===row.id)||row),...s.resourceMeta[row.id]}:row;
 const receipt=raw.receiptId?s.receipts.find(r=>r.id===raw.receiptId):null;
 const date=receipt?receipt.date:raw.purchased,shop=receipt?shopName(s,receipt):shopName(s,raw);

}
// Set where and when stock was bought. Undefined leaves a field alone; an empty string clears it.
function setPurchaseDetails(s,ids,{date,shop}={}){
 need(Array.isArray(ids)&&ids.length,'Choose at least one item.');
 need(date===undefined||date===''||validDate(date),'Choose a valid purchase date.');
 const name=shop===undefined?undefined:String(shop).trim().slice(0,80);
 need(date!==undefined||name!==undefined,'Enter a shop or a date.');
 let shopRef=null;if(name){const r=ensureShop(s,name);s=r.state;shopRef=findShop(s,r.shopId);}
 const wanted=new Set(ids);let changed=0;
 const apply=x=>{changed++;const out={...x};
  if(date!==undefined){if(date)out.purchased=date;else delete out.purchased;}
  if(name!==undefined){if(name){out.merchant=shopRef.name;out.shopId=shopRef.id;}else{delete out.merchant;delete out.shopId;}delete out.shop;}
  return out;};
 const lots=s.lots.map(l=>wanted.has(l.id)&&!l.receiptId?apply(l):l);
 const resources=s.resources.map(r=>wanted.has(r.id)&&!r.receiptId?apply(r):r);
 need(changed,'These come from a receipt. Change the receipt instead.');
 return {...s,lots,resources};
}
function purchaseRange(period,from='',to='',today=isoDate(new Date())){
 if(period==='today')return {from:today,to:today};
 if(period==='week')return {from:weekStart(today),to:addDays(weekStart(today),6)};
 if(period==='month'){const d=new Date(today+'T12:00:00');return {from:today.slice(0,7)+'-01',to:isoDate(new Date(d.getFullYear(),d.getMonth()+1,0,12))};}

}
function filterStockPurchases(s,groups,{shop='',categoryId='',period='all',from='',to='',today=isoDate(new Date())}={}){
 const range=purchaseRange(period,from,to,today),invalid=range.from&&range.to&&range.from>range.to;
 if(invalid)return [];
 return groups.map(g=>({...g,purchaseFiltered:!!shop||period!=='all',rows:g.rows.filter(row=>{
  if(categoryId&&(g.item?.categoryId||row.categoryId)!==categoryId)return false;
  const p=stockPurchase(s,row);
  if(shop==='__unknown'?!!p.shop:shop&&p.shopKey!==shop)return false;
  if(period==='unknown')return !p.date;
  if((range.from||range.to)&&!p.date)return false;
  return (!range.from||p.date>=range.from)&&(!range.to||p.date<=range.to);
 })})).filter(g=>g.rows.length);
}

function knownShops(s){

// ---- One connected catalogue: shops, products and their prices ----------------------------
// Shops are records with their own details. Everything that was bought somewhere keeps the shop's
// name as text too, so older data and backups stay readable, and gains a shopId link.
const SHOP_KINDS=[['supermarket','Supermarket'],['local','Local shop or market'],['online','Online'],['cafe','Café or restaurant'],['other','Other']];
function shopKey(name){return String(name||'').toLocaleLowerCase('en-GB').replace(/[’']/g,'').replace(/[^a-z0-9&]+/g,' ').trim();}
function findShop(s,ref){
  if(!ref)return null;const shops=s.shops||[],k=shopKey(ref);
  return shops.find(x=>x.id===ref)||shops.find(x=>shopKey(x.name)===k)||shops.find(x=>(x.aliases||[]).some(a=>shopKey(a)===k))||null;
}
function shopName(s,x){const shop=x?.shopId?findShop(s,x.shopId):null;return shop?shop.name:String(x?.merchant||x?.shop||'').trim();}
function guessShopKind(name){const n=String(name||'').toLowerCase();return /lidl|tesco|aldi|morrisons|sainsbury|asda|co-?op|waitrose|iceland|m&s|marks|farmfoods|spar|londis/.test(n)?'supermarket':/amazon|online|deliveroo|uber|just eat|ocado|too good to go|ebay/.test(n)?'online':/manca|caf[eé]|restaurant|pizza|coffee|costa|starbucks|greggs|pret|bar\b|pub\b/.test(n)?'cafe':'other';}
function newShop(s,name,extra={}){
  const clean=String(name||'').trim(),base='shop-'+(shopKey(clean).replace(/ /g,'-')||'unnamed');
  const id=(s.shops||[]).some(x=>x.id===base)?uid('shop'):base;
  return {id,name:clean,kind:guessShopKind(clean),photo:'',area:'',website:'',notes:'',aliases:[],...extra};
}
// First load after this update: create shop records from every shop name already used.
function normalizeConnected(s){
  if(Array.isArray(s.shops))return typeof seedTypesInto==='function'?seedTypesInto(s):s;
  const names=new Map(),add=n=>{n=String(n||'').trim();const k=shopKey(n);if(n&&!names.has(k))names.set(k,n);};
  const legacy=o=>o.merchant||(String(o.receiptId||'').startsWith('lidl-')?'Lidl':'');
  for(const r of s.receipts||[])add(r.merchant);for(const l of s.lists||[])add(l.merchant);
  for(const i of s.items||[]){add(i.shop);for(const o of i.observations||[])add(legacy(o));}
  for(const x of [...(s.lots||[]),...(s.resources||[])])add(x.merchant);
  let shops=[];for(const n of [...names.values()].sort((a,b)=>a.localeCompare(b)))shops.push(newShop({shops},n));
  // (the linked copy is built below, then the product-type tree is seeded on top)
  const id=n=>findShop({shops},n)?.id;
  const link=x=>{const i=x.merchant&&!x.shopId?id(x.merchant):null;return i?{...x,shopId:i}:x;};
  const out={...s,shops,receipts:(s.receipts||[]).map(link),lists:(s.lists||[]).map(link),lots:(s.lots||[]).map(link),resources:(s.resources||[]).map(link),
    items:(s.items||[]).map(i=>({...i,...(i.shop&&!i.usualShopId&&id(i.shop)?{usualShopId:id(i.shop)}:{}),
      observations:(i.observations||[]).map((o,n)=>{const m=legacy(o),sid=o.shopId||id(m);return {...o,id:o.id||'obs-'+(o.receiptId||'price')+'-'+n,...(m?{merchant:m}:{}),...(sid?{shopId:sid}:{})};})}))};
  return typeof seedTypesInto==='function'?seedTypesInto(out):out;
}
// Find a shop by id or name, or create it. A blank name means "no shop".
function ensureShop(s,ref){
  const name=String(ref||'').trim();if(!name)return {state:s,shopId:''};
  const found=findShop(s,name);if(found)return {state:s,shopId:found.id};

function saveShop(s,form){

  need(!form.kind||SHOP_KINDS.some(k=>k[0]===form.kind),'Choose a kind of shop.');
  const clash=(s.shops||[]).find(x=>x.id!==form.id&&shopKey(x.name)===shopKey(name));need(!clash,'You already have a shop called '+clash?.name+'.');

  if(!old){const shop={...newShop(s,name),...clean,id:newShop(s,name).id};return {...s,shops:[...(s.shops||[]),shop]};}
  let next={...s,shops:s.shops.map(x=>x.id===old.id?{...old,...clean}:x)};
  if(old.name!==name){// Renaming: keep the stored names in step so lists, receipts and notes read the same.
    const was=old.name+' · ',fix=x=>x.shopId===old.id?{...x,merchant:name}:x;
    const receiptIds=new Set(next.receipts.filter(r=>r.shopId===old.id).map(r=>r.id));
    next={...next,receipts:next.receipts.map(fix),lists:next.lists.map(fix),lots:next.lots.map(fix),resources:next.resources.map(fix),
      expenses:next.expenses.map(x=>receiptIds.has(x.receiptId)&&typeof x.note==='string'&&x.note.startsWith(was)?{...x,note:name+' · '+x.note.slice(was.length)}:x),

// Removing a shop only removes the record. Purchases keep the shop's name as text.
function removeShop(s,id){
  need((s.shops||[]).some(x=>x.id===id),'Shop not found.');

  return {...s,shops:s.shops.filter(x=>x.id!==id),receipts:s.receipts.map(un),lists:s.lists.map(un),lots:s.lots.map(un),resources:s.resources.map(un),
    items:s.items.map(i=>{const o={...i,observations:(i.observations||[]).map(un)};if(o.shopId===id)delete o.shopId;if(o.usualShopId===id)delete o.usualShopId;return o;})};

function shopMatches(s,shop,x){return x.shopId?x.shopId===shop.id:shopKey(x.merchant)===shopKey(shop.name)||(shop.aliases||[]).some(a=>shopKey(a)===shopKey(x.merchant));}
// Visits, spending and the products bought at one shop.
function shopStats(s,shop){
  const receipts=s.receipts.filter(r=>shopMatches(s,shop,r)).sort((a,b)=>b.date.localeCompare(a.date));
  const products=[];
  for(const i of s.items){const obs=(i.observations||[]).filter(o=>shopMatches(s,shop,o)).sort((a,b)=>b.date.localeCompare(a.date));if(obs.length)products.push({item:i,count:obs.length,last:obs[0],unitPence:unitPrice(obs[0])});}
  products.sort((a,b)=>b.last.date.localeCompare(a.last.date)||a.item.name.localeCompare(b.item.name));

  const dates=[...receipts.map(r=>r.date),...s.items.flatMap(i=>(i.observations||[]).filter(o=>shopMatches(s,shop,o)).map(o=>o.date))].sort();

// Products: a general type ("Chocolate bar"), then optional brand, then optional shop (own-brand).
// What a product is, in one line: the type it is filed under, the brand, and whose own product it is.
function productLine(s,i){const node=i.typeId?typeNode(s,i.typeId):null;return [node&&node.name.toLocaleLowerCase('en-GB')!==String(i.name||'').toLocaleLowerCase('en-GB')?node.name:'',i.brand,i.shopId?findShop(s,i.shopId)?.name:''].filter(Boolean).join(' · ');}


// ---- Who sells it: a shop's own product, or one you can buy anywhere ----------------------
// Some products belong to one shop and are not sold anywhere else: Morrisons Savers, Morrisons
// The Best, Lidl's Milbona, Aldi's Specially Selected. Everything else - Philadelphia, Nissin,
// a plain white loaf - is the same product wherever you find it, so its prices can be compared
// between shops. A product with no own shop is treated as sold anywhere.
const OWN_LABELS=[
 ['Morrisons',['Morrisons Savers','Morrisons The Best','Morrisons The Fishmonger\u2019s','Morrisons The Greengrocer\u2019s','Morrisons The Butcher\u2019s','Morrisons The Baker\u2019s','Morrisons Market St','Morrisons Market Street','Morrisons Free From','Morrisons','Nutmeg']],
 ['Lidl',['Lidl','Deluxe','Milbona','Cien','Formil','Crownfield','Freeway','Dulano','Combino','Chef Select','Snaktastic','Italiamo','Vemondo','Harvest Basket','Birchwood','Ocean Sea','Alesto','Bellarom','Kania','Maribel','Solevita','Pilos','Belbake','Lupilu','Vitasia','Sondey','Goldessa','Newgate','Eridanous','McEnnedy','W5']],
 ['Aldi',['Aldi','Specially Selected','Everyday Essentials','Nature\u2019s Pick','Ashfields','Cowbelle','Bramwells','Village Bakery','Snackrite','Almat','Lacura','Harvest Morn','The Foodie Market','Four Seasons','Emporium','Corale','Brooklea','Oakhurst','Inspired Cuisine']],
 ['Tesco',['Tesco Finest','Tesco','Stockwell & Co','Hearty Food Co','Ms Molly\u2019s','Creamfields','Eastman\u2019s','Redmere Farms','Willow Farms','Woodside Farms','Rosedene Farms','Nightingale Farms','Suntrail Farms','Boswell Farms']],
 ['Sainsbury\u2019s',['Taste the Difference','By Sainsbury\u2019s','Sainsbury\u2019s','Stamford Street']],
 ['Asda',['Asda Extra Special','Asda Just Essentials','Just Essentials','Asda']],
 ['Co-op',['Co-op Irresistible','Co-op','Coop']],
 ['Waitrose',['Essential Waitrose','Waitrose No 1','Waitrose','Duchy Organic']],
 ['M&S',['Marks & Spencer','Marks and Spencer','M&S']],
 ['Iceland',['Iceland']],

function labelKey(x){return String(x||'').toLocaleLowerCase('en-GB').replace(/[\u2019']/g,'').replace(/[^a-z0-9&]+/g,' ').trim();}
// The shop's own range a product name starts with, e.g. "Morrisons Savers Cheese Slices 200g".
function ownLabelGuess(name){
  const key=labelKey(name);if(!key)return null;let best=null;
  for(const [shop,ranges] of OWN_LABELS)for(const range of ranges){const r=labelKey(range);
    if((key===r||key.startsWith(r+' '))&&(!best||r.length>best.key.length))best={shop,brand:range,key:r};}
  return best?{shop:best.shop,brand:best.brand}:null;
}
function ownShopOf(s,item){return item&&item.shopId?findShop(s,item.shopId):null;}
function soldAnywhere(item){return !(item&&item.shopId);}
function listWords(xs){return xs.length<2?xs.join(''):xs.slice(0,-1).join(', ')+' and '+xs[xs.length-1];}
// Where you can buy it: its own shop only, or every shop you have seen it in.
function whereToBuy(s,item){
  const own=ownShopOf(s,item),seen=[];
  for(const o of (item&&item.observations)||[]){const n=shopName(s,o);if(n&&!seen.includes(n))seen.push(n);}
  return {own,shops:seen,anywhere:!own,
   text:own?'Only at '+own.name:seen.length?'Sold anywhere \u00b7 you buy it at '+listWords(seen.slice(0,3)):'Sold anywhere'};
}
// Products of one kind, split into the ones anyone sells and each shop's own versions.
function sellerGroups(s,items){
  const any=items.filter(i=>!i.shopId),out=any.length?[{key:'any',label:'Sold anywhere',items:any}]:[];
  const byShop=new Map();
  for(const i of items)if(i.shopId){const g=byShop.get(i.shopId)||{key:i.shopId,label:'Only at '+((findShop(s,i.shopId)||{}).name||'one shop'),items:[]};g.items.push(i);byShop.set(i.shopId,g);}
  return [...out,...[...byShop.values()].sort((a,b)=>a.label.localeCompare(b.label))];

// A bought line can name whose own product it is; an empty name means any shop sells it.
function ownLabelFor(s,l){
  if(l.ownShop!=null){const n=String(l.ownShop).trim();if(!n)return null;const g=ownLabelGuess(l.name);
   return {shop:n,brand:l.brand||(g&&shopKey(g.shop)===shopKey(n)?g.brand:'')};}
  const g=ownLabelGuess(l.name);return g?{shop:g.shop,brand:g.brand}:null;

// Prices: every purchase is a price record (from a receipt or added by hand), with optional offer details.
function unitPrice(o){return o.quantity>0?Math.round(o.linePence/o.quantity):o.linePence;}
function tidyPrice(o){const x={...o};if(!x.offer)delete x.offer;if(x.regularPence==null||x.regularPence==='')delete x.regularPence;if(!x.note)delete x.note;else x.note=String(x.note).trim();if(!x.shopId)delete x.shopId;if(!x.merchant)delete x.merchant;return x;}
function priceInput(s,d){

  need(Number.isSafeInteger(d.linePence)&&d.linePence>=0,'Enter the price you paid.');
  need(d.regularPence==null||Number.isSafeInteger(d.regularPence)&&d.regularPence>=0,'Check the normal price.');
  const linked=ensureShop(s,d.shopId&&findShop(s,d.shopId)?d.shopId:d.shop);
  return {state:linked.state,fields:{date:d.date,quantity,linePence:d.linePence,shopId:linked.shopId,merchant:linked.shopId?findShop(linked.state,linked.shopId).name:'',offer:!!d.offer,regularPence:d.regularPence,note:d.note}};

// Receipt prices keep their amount and date (change those on the receipt); offer details and notes can change.
function editPrice(s,itemId,priceId,d){

  if(old.receiptId){need(d.regularPence==null||Number.isSafeInteger(d.regularPence)&&d.regularPence>=0,'Check the normal price.');
    const next=tidyPrice({...old,offer:!!d.offer,regularPence:d.regularPence,note:d.note});return {...s,items:s.items.map(i=>i.id===itemId?withPriceHistory(i,i.observations.map(o=>o.id===priceId?next:o)):i)};}
  const {state,fields}=priceInput(s,d);

// Price history for one product: every price per unit in date order, grouped by shop, with the change since last time.
function priceHistory(s,item){
  const points=(item.observations||[]).map((o,n)=>({...o,id:o.id||'obs-'+n,unitPence:unitPrice(o),shop:shopName(s,o)||'Shop not recorded',shopKey:o.shopId||('name:'+shopKey(shopName(s,o)))})).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id)));
  if(!points.length)return {points,shops:[]};
  const byShop=new Map();for(const p of points){const x=byShop.get(p.shopKey)||{key:p.shopKey,shop:p.shop,points:[]};x.points.push(p);byShop.set(p.shopKey,x);}
  const shops=[...byShop.values()].map(x=>({...x,latest:x.points.at(-1),lowest:x.points.reduce((a,b)=>b.unitPence<a.unitPence?b:a),highest:x.points.reduce((a,b)=>b.unitPence>a.unitPence?b:a)})).sort((a,b)=>b.latest.date.localeCompare(a.latest.date));
  const latest=points.at(-1),previous=byShop.get(latest.shopKey).points.at(-2)||null;
  return {points,shops,latest,previous,change:previous&&previous.unitPence?(latest.unitPence-previous.unitPence)/previous.unitPence:null,
    lowest:points.reduce((a,b)=>b.unitPence<a.unitPence?b:a),highest:points.reduce((a,b)=>b.unitPence>a.unitPence?b:a),offers:points.filter(p=>p.offer||p.regularPence>p.unitPence).length};

  const idx=itemIndex(s),key=itemKey(ing.name),wanted=ing.typeId?typeDescendants(s,ing.typeId):null;
  return r=>{const item=(r.itemId&&s.items.find(i=>i.id===r.itemId))||idx.get(itemKey(r.name));
    if(ing.itemId)return item?.id===ing.itemId||(!item&&itemKey(r.name)===key);
    if(wanted){const id=item?.typeId||classifyTypeId(s,r.name,item?.categoryId||r.categoryId);if(id&&wanted.has(id))return true;}

const KEEP_REASONS=[['binned','Threw it away'],['broke','It broke'],['gave','Gave it away'],['sold','Sold it'],['lost','Lost it'],['returned','Returned it to the shop']];

function keptSince(s,row){
  const lot=row.source==='lot'?s.lots.find(l=>l.id===row.id):null;

}
function keptAge(s,row,today=isoDate(new Date())){const from=keptSince(s,row);if(!validDate(from))return null;const months=daysBetween(from,today)/30.44;return {from,months,text:months<1.5?Math.max(1,Math.round(daysBetween(from,today)))+' days':months<24?Math.round(months)+' months':(Math.round(months/12*10)/10)+' years'};}
function retireStock(s,id,{reason='binned',date=isoDate(new Date()),note=''}={}){
  const row=stockRows(s).find(r=>r.id===id);need(row,'Stock item not found.');

  need(row.remaining>0,'This one is already recorded as gone.');
  need(validDate(date),'Choose a valid date.');need(KEEP_REASONS.some(k=>k[0]===reason),'Choose what happened to it.');
  need(!reservedAmount(s,id),'It is kept for a planned meal. Change that meal first.');
  const event={id:uid('event'),sourceId:id,action:'retire',reason,amount:row.remaining,unit:row.unit,name:row.name,date,note:String(note||'').trim()};
  const next=row.source==='lot'?{...s,lots:s.lots.map(l=>l.id===id?{...l,remaining:0,retired:{reason,date}}:l)}
    :{...s,resources:s.resources.map(r=>r.id===id?{...r,used:true,usedDate:date}:r),resourceMeta:{...s.resourceMeta,[id]:{...s.resourceMeta[id],retired:{reason,date}}}};

// It turned up again, or it was recorded by mistake.
function keepStock(s,id){

  const lot=row.source==='lot'?s.lots.find(l=>l.id===row.id):null,meta=row.source==='resource'?s.resourceMeta[row.id]:null;

/* Presentation rules: keep the original records intact. */
function historicalItem(s, item) {
  const observations = item.observations || [];
  const bought = s.receipts.some(r => (!s.trackingStart||r.date>=s.trackingStart) && r.lines.some(l => l.itemId === item.id));
  const stocked = s.lots.some(l => l.itemId === item.id && (!s.trackingStart||l.purchased>=s.trackingStart));
  return !bought && !stocked && (item.referenceOnly || observations.length > 0 && observations.every(o => s.trackingStart&&o.date<s.trackingStart));
}
function catalogueScope(s, mode = 'current') {
  if (mode === 'all') return s;
  return {...s, items: s.items.filter(i => mode === 'history' ? historicalItem(s, i) : !historicalItem(s, i))};
}
function transactionRows(s, rows) {
  const out = [], seen = new Map();
  for (const x of rows) {
    const receipt = !x.refund && x.receiptId && s.receipts.find(r => r.id === x.receiptId);
    const key = receipt ? 'receipt:' + receipt.id : x.refund && x.groupId ? 'refund:' + x.groupId : null;
    if (key && seen.has(key)) {
      const g = seen.get(key);
      g.amount = Math.round(g.amount * 100 + x.amount * 100) / 100;
      if (g.fors) g.fors.push(x.forNote);
      if (g.expenseIds) g.expenseIds.push(x.id);
      continue;
    }
    const row = receipt ? {...x, id:key, receiptId:receipt.id, receiptTotal:true,
      note:receipt.merchant || 'Receipt', itemCount:receipt.lines.length, expenseIds:[x.id], place:receipt.place || ''}
      : x.refund ? {...x, fors:[x.forNote]} : {...x};
    if (key) seen.set(key, row);
    out.push(row);
  }
  return out;
}
function transactionDialog(x) {
  return {type:x.receiptTotal ? 'receipt-detail' : x.refund ? 'refund-detail' : 'expense-detail', id:x.receiptTotal ? x.receiptId : x.id};
}

/* Monthly allocations are a plan for remaining stock, never new purchases. */
function allocationGroups(s,mode='planned'){
 return catalogueEntries(s).flatMap(g=>{
  const rows=allocatableRows(s,g.rows.map(r=>r.id)),key=r=>unitKey(r.unit)+'|'+r.tracking+'|'+(r.receiptId||stockPurchase(s,r).date||'opening');
  return [...new Set(rows.map(key))].map(k=>({...g,key:g.key+'|'+k,rows:rows.filter(r=>key(r)===k)})).filter(group=>mode==='planned'?group.rows.some(r=>r.availableMonth):group.rows.every(r=>!r.availableMonth));
 });
}
function repeatMonthlyAmount(total,amount,from,to){
 need(/^\d{4}-(0[1-9]|1[0-2])$/.test(from)&&/^\d{4}-(0[1-9]|1[0-2])$/.test(to)&&to>=from,'Choose a valid range of months.');
 const n=positive(amount),out={};let month=from;
 while(month<=to&&Object.keys(out).length<120){out[month]=n;month=nextCalendarMonth(month);}
 need(month>to,'Choose at most 120 months.');
 const assigned=+(Object.keys(out).length*n).toFixed(6);need(assigned<=total+1e-6,'There is not enough remaining stock for that amount every month.');

}
function allocatableRows(s,ids){

}
function allocationTotals(s,ids){

}
function assignStockMonths(s,ids,targets,date=isoDate(new Date())){

 need(new Set(rows.map(r=>unitKey(r.unit))).size===1,'Plan different units separately.');
 need(new Set(rows.map(r=>r.tracking)).size===1,'Plan different tracking methods separately.');
 const total=+rows.reduce((n,r)=>n+r.remaining,0).toFixed(6);
 const chunks=Object.entries(targets).map(([month,value])=>{
   const amount=Number(value||0);need(month===''||/^\d{4}-(0[1-9]|1[0-2])$/.test(month),'Choose a valid month.');
   need(Number.isFinite(amount)&&amount>=0,'Enter zero or a positive amount.');
   need(rows[0].tracking!=='count'||rows.some(r=>!Number.isInteger(r.remaining))||Number.isInteger(amount),'Use whole quantities for counted stock.');
   return {month,amount};
 }).filter(x=>x.amount>0).sort((a,b)=>a.month.localeCompare(b.month));
 need(Math.abs(chunks.reduce((n,x)=>n+x.amount,0)-total)<1e-6,'Keep the total at '+displayQty(total,rows[0].unit)+'. Put anything unassigned in Any time.');
 let resources=[...s.resources],lots=[...s.lots],meta={...s.resourceMeta},index=0;
 for(const row of rows){
   const original=row.source==='lot'?s.lots.find(x=>x.id===row.id):s.resources.find(x=>x.id===row.id);
   let remaining=row.remaining,first=true;
   while(remaining>1e-6){
     while(chunks[index]?.amount<1e-6)index++;
     const chunk=chunks[index];need(chunk,'Allocation total did not reconcile.');
     const take=+Math.min(remaining,chunk.amount).toFixed(6),id=first?row.id:uid(row.source==='lot'?'lot':'res');
     if(row.source==='lot'){
       const used=first?original.quantity-original.remaining:0;
       const next={...original,id,quantity:+(used+take).toFixed(6),remaining:take,availableMonth:chunk.month,splitFrom:original.splitFrom||original.id};
       lots=first?lots.map(x=>x.id===row.id?next:x):[...lots,next];
     }else{
       const next={...original,id,qty:take,allocatedMonth:chunk.month,scope:undefined,availableFrom:undefined};
       if(!first)next.parentId=original.parentId||original.id;
       resources=first?resources.map(x=>x.id===row.id?next:x):[...resources,next];
       if(!first&&meta[row.id])meta[id]={...meta[row.id]};
     }
     remaining=+(remaining-take).toFixed(6);chunk.amount=+(chunk.amount-take).toFixed(6);first=false;
   }
 }

}

function typeSlug(name,taken){
 const base='type-'+String(name||'').toLocaleLowerCase('en-GB').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'type';
 if(!taken||!taken.has(base))return base;let n=2;while(taken.has(base+'-'+n))n++;return base+'-'+n;
}
function seedProductTypes(){
 const out=[],taken=new Set();
 for(const [family,categoryId,kids] of SEED_TYPES){
  const fid=typeSlug(family,taken);taken.add(fid);
  out.push({id:fid,name:family,parentId:'',categoryId,match:[],seeded:true});
  for(const [name,match,cat] of kids){const id=typeSlug(name,taken);taken.add(id);out.push({id,name,parentId:fid,categoryId:cat||categoryId,match,seeded:true});}
 }
 return out;
}
// ---- Reading the tree ---------------------------------------------------------------------
function typeList(s){return s.productTypes||[];}
function typeNode(s,id){return id?typeList(s).find(x=>x.id===id)||null:null;}
function typeChildren(s,id){return typeList(s).filter(x=>(x.parentId||'')===(id||'')&&!x.archived).sort((a,b)=>a.name.localeCompare(b.name));}
function typePath(s,id){const out=[];let n=typeNode(s,id),guard=0;while(n&&guard++<20){out.unshift(n);n=n.parentId?typeNode(s,n.parentId):null;}return out;}
function typeLabel(s,id,sep=' · '){return typePath(s,id).map(x=>x.name).join(sep);}
function typeDescendants(s,id){
 const out=new Set(id?[id]:[]),list=typeList(s);let added=true,guard=0;
 while(added&&guard++<20){added=false;for(const x of list)if(x.parentId&&out.has(x.parentId)&&!out.has(x.id)){out.add(x.id);added=true;}}
 return out;
}
function typeDepth(s,id){return typePath(s,id).length;}
// Every product filed under a type (and, unless shallow, under anything inside it).
function itemsInType(s,id,{deep=true}={}){const ids=deep?typeDescendants(s,id):new Set([id]);return s.items.filter(i=>i.typeId&&ids.has(i.typeId)&&!i.archived);}
// ---- Filing things ------------------------------------------------------------------------
const TYPE_STOP=/\b(and|the|with|for|pack|packs|x|g|kg|ml|l|cl|litre|litres|large|small|medium|mini|fresh|frozen|organic|value|basics|finest|taste|difference|essential|essentials)\b/g;
function typeText(name){return ' '+String(name||'').toLocaleLowerCase('en-GB').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()+' ';}
function typeMatches(text,word){
 const w=String(word||'').toLocaleLowerCase('en-GB').trim();if(w.length<3)return 0;
 const forms=[w,w+'s',w+'es',w.replace(/y$/,'ies')];
 for(const f of forms)if(text.includes(' '+f+' '))return w.length;
 return 0;
}
// The best type for a name: its own words first, then the words of each seeded type.
function classifyTypeId(s,name,categoryId){
 const text=typeText(name);if(text.trim().length<2)return '';
 let best=null;
 for(const node of typeList(s)){
  if(node.archived)continue;
  const words=[node.name,...(node.aliases||[]),...(node.match||[])];
  let score=0;for(const w of words)score=Math.max(score,typeMatches(text,w));
  if(!score)continue;
  const depth=node.parentId?2:1,fit=score+depth*4+(categoryId&&node.categoryId===categoryId?3:0);
  if(!best||fit>best.fit)best={id:node.id,fit};

 return best?best.id:'';
}
// Find or make a type by path, e.g. ['Pizza','Mini pizza'].
function ensureTypePath(s,names,categoryId){
 let state=s,parent='';
 for(const raw of names){
  const name=String(raw||'').trim();if(!name)continue;
  const found=typeChildren(state,parent).find(x=>x.name.toLocaleLowerCase('en-GB')===name.toLocaleLowerCase('en-GB'));
  if(found){parent=found.id;continue;}
  const taken=new Set(typeList(state).map(x=>x.id)),node={id:typeSlug(name,taken),name,parentId:parent,categoryId:categoryId||typeNode(state,parent)?.categoryId||'uncategorised',match:[]};
  state={...state,productTypes:[...typeList(state),node]};parent=node.id;
 }
 return {state,id:parent};
}
function saveType(s,form){
 const name=String(form.name||'').trim();need(name,'Give it a name.');need(name.length<=60,'Use a shorter name.');
 const parentId=form.parentId||'';need(!parentId||typeNode(s,parentId),'Choose where it belongs.');
 need(!form.id||!typeDescendants(s,form.id).has(parentId),'A type cannot sit inside itself.');
 const clash=typeChildren(s,parentId).find(x=>x.id!==form.id&&x.name.toLocaleLowerCase('en-GB')===name.toLocaleLowerCase('en-GB'));
 need(!clash,'There is already a “'+name+'” here.');
 const old=typeNode(s,form.id);
 const clean={name,parentId,categoryId:form.categoryId||old?.categoryId||typeNode(s,parentId)?.categoryId||'uncategorised',image:form.image||'',
  aliases:(form.aliases||[]).map(x=>String(x).trim()).filter(Boolean),notes:String(form.notes||'').trim()};
 if(!old){const taken=new Set(typeList(s).map(x=>x.id));return {...s,productTypes:[...typeList(s),{id:typeSlug(name,taken),match:[],...clean}]};}
 return {...s,productTypes:typeList(s).map(x=>x.id===old.id?{...x,...clean}:x)};
}
// Removing a type keeps everything inside it: children and products move up one level.
function removeType(s,id){
 const node=typeNode(s,id);need(node,'Type not found.');
 const up=node.parentId||'';
 return {...s,productTypes:typeList(s).filter(x=>x.id!==id).map(x=>x.parentId===id?{...x,parentId:up}:x),
  items:s.items.map(i=>i.typeId===id?{...i,typeId:up||undefined}:i)};
}

function typeSummary(s,id){
 const items=itemsInType(s,id),ids=new Set(items.map(i=>i.id));
 const rows=stockRows(s).filter(r=>r.remaining>0&&(r.itemId&&ids.has(r.itemId)||!r.itemId&&items.some(i=>itemKey(i.name)===itemKey(r.name))));
 const prices=items.flatMap(i=>(i.observations||[]).map(o=>({...o,item:i,unitPence:unitPrice(o),shop:shopName(s,o)||'Shop not recorded'})));
 const sorted=[...prices].sort((a,b)=>a.date.localeCompare(b.date));
 const cheapest=prices.length?prices.reduce((a,b)=>b.unitPence<a.unitPence?b:a):null;
 // Only add amounts up when they are in the same unit: 400 g of grated cheese and 8 triangles do not make 408 of anything.
 const units=[...new Set(rows.map(r=>unitKey(r.unit)))];
 const mixed=units.length>1,unit=rows[0]?.unit||items[0]?.unit||'';
 return {items,rows,mixed,products:new Set(rows.map(r=>r.itemId||itemKey(r.name))).size,
  atHome:mixed?null:rows.reduce((n,r)=>n+r.remaining,0),unit:mixed?'':unit,
  prices,latest:sorted.at(-1)||null,cheapest,shops:[...new Set(prices.map(p=>p.shop))],
  children:typeChildren(s,id)};
}
// Products and types that match what someone typed, for pickers.
function typeSearch(s,query,limit=8){
 const q=String(query||'').trim().toLocaleLowerCase('en-GB');if(!q)return [];
 return typeList(s).filter(x=>!x.archived&&[x.name,...(x.aliases||[])].join(' ').toLocaleLowerCase('en-GB').includes(q))
  .map(x=>({node:x,count:itemsInType(s,x.id).length}))
  .sort((a,b)=>(a.node.name.toLocaleLowerCase('en-GB').startsWith(q)?-1:0)-(b.node.name.toLocaleLowerCase('en-GB').startsWith(q)?-1:0)||b.count-a.count||a.node.name.localeCompare(b.node.name))
  .slice(0,limit);
}
// The type behind a cupboard entry, whether or not it has a catalogue product yet.
function entryTypeId(s,g){

function seedTypesInto(s){
